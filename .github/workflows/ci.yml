name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: quasar

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: all
            features: "lance,iceberg"
          - name: lance
            features: lance
          - name: iceberg
            features: iceberg
          - name: none
            features: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo clippy --no-default-features --features "${{ matrix.features }}" -- -D warnings
        working-directory: quasar

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: all
            features: "lance,iceberg"
          - name: lance
            features: lance
          - name: iceberg
            features: iceberg
          - name: none
            features: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Run unit tests
        run: cargo test --no-default-features --features "${{ matrix.features }}" --lib
        working-directory: quasar

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (default features)
        run: docker build -t quasar-server:latest .
        working-directory: quasar
      - name: Build Docker image (lance only)
        run: docker build --build-arg FEATURES=lance -t quasar-server:lance .
        working-directory: quasar
      - name: Build Docker image (iceberg only)
        run: docker build --build-arg FEATURES=iceberg -t quasar-server:iceberg .
        working-directory: quasar
