services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: quasar
      POSTGRES_PASSWORD: quasar
      POSTGRES_DB: quasar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quasar -d quasar"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: quasar-server:latest
    environment:
      QUASAR_DATABASE_URL: postgres://quasar:quasar@db:5432/quasar
      QUASAR_LOG_LEVEL: info
      QUASAR_WAREHOUSE_PATH: s3://warehouse/
      QUASAR_S3_ENDPOINT: http://minio:9000
      QUASAR_S3_ACCESS_KEY: minioadmin
      QUASAR_S3_SECRET_KEY: minioadmin
      QUASAR_S3_REGION: us-east-1
      QUASAR_S3_ALLOW_HTTP: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Spark 集成测试容器（可选，默认不启动）
  # 运行方式：docker compose -f docker-compose.spark.yml --profile test run --rm spark-test
  spark-test:
    image: quasar-spark-test:latest
    profiles:
      - test
    environment:
      BASE_URL: http://server:8080
      MINIO_ENDPOINT: http://minio:9000
      RUN_MODE: docker
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      server:
        condition: service_started
    volumes:
      - ./tests:/tests:ro
    command: python3 /tests/spark_iceberg_integration.py

volumes:
  pgdata:
  minio_data:
